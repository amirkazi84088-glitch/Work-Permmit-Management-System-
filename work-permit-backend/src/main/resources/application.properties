# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}


# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/wpms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wpms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wpms@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:d3Btc1RlYW1FcnJvcjQwNFNlY3JldEtleTIwMjZTdXBlckxvbmdTZWN1cmVTdHJpbmcxMjM0NTY=}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}


# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=work-permit-backend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.seed.enabled=${APP_SEED_ENABLED:true}
